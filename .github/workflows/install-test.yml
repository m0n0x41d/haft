name: Install Script Test

on:
  pull_request:
    paths:
      - 'install.sh'
      - '.goreleaser.yaml'
      - '.github/workflows/install-test.yml'
  workflow_dispatch:

jobs:
  install:
    name: Install (${{ matrix.name }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Check installer syntax
        run: bash -n install.sh

      - name: Reject a missing candidate archive
        run: |
          missing_home="$RUNNER_TEMP/haft-missing-archive-home"
          missing_log="$RUNNER_TEMP/haft-missing-archive.log"

          if HOME="$missing_home" \
            HAFT_INSTALL_ARCHIVE="$RUNNER_TEMP/absent-haft-candidate.tar.gz" \
              bash install.sh >"$missing_log" 2>&1; then
            echo "missing HAFT_INSTALL_ARCHIVE unexpectedly succeeded" >&2
            exit 1
          fi
          grep -F 'HAFT_INSTALL_ARCHIVE is not a regular file' "$missing_log"

      - name: Exercise current candidate archive
        run: |
          candidate_version=9.0.0
          candidate_sha=$(git rev-parse --short HEAD)
          archive_root="$RUNNER_TEMP/haft-candidate-archive"
          archive_path="$RUNNER_TEMP/haft-candidate.tar.gz"
          candidate_home="$RUNNER_TEMP/haft-candidate-home"
          install_bin="$candidate_home/.local/bin/haft"

          mkdir -p "$archive_root/runtimes/haft-embed/bin"
          mkdir -p "$candidate_home/.local/bin"
          mkdir -p "$candidate_home/.haft/runtimes/open-sleigh/current"
          mkdir -p "$candidate_home/.open-sleigh/workspaces"

          printf '%s\n' managed-v8-runtime \
            > "$candidate_home/.haft/runtimes/open-sleigh/current/sentinel"
          printf '%s\n' preserve-user-data \
            > "$candidate_home/.open-sleigh/workspaces/sentinel"

          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/m0n0x41d/haft/internal/cli.Version=$candidate_version \
              -X github.com/m0n0x41d/haft/internal/cli.Commit=$candidate_sha \
              -X github.com/m0n0x41d/haft/internal/cli.BuildDate=1970-01-01T00:00:00Z" \
            -o "$archive_root/haft" \
            ./cmd/haft/
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'printf "%s\n" candidate-haft-embed' \
            > "$archive_root/runtimes/haft-embed/bin/haft-embed"
          chmod +x "$archive_root/runtimes/haft-embed/bin/haft-embed"
          tar -czf "$archive_path" -C "$archive_root" .

          HOME="$candidate_home" \
          HAFT_INSTALL_ARCHIVE="$archive_path" \
            bash install.sh

          test -x "$install_bin"
          "$install_bin" version | grep -F "haft $candidate_version"
          "$install_bin" version | grep -F "commit:  $candidate_sha"

          response=$(printf '%s\n' \
            '{"jsonrpc":"2.0","method":"initialize","id":1,"params":{}}' |
            HOME="$candidate_home" "$install_bin" serve 2>/dev/null)
          printf '%s\n' "$response" | grep -F '"protocolVersion"'
          printf '%s\n' "$response" |
            grep -F '"serverInfo":{"name":"haft","version":"9.0.0"}'

          test ! -e "$candidate_home/.haft/runtimes/open-sleigh/current"
          grep -F 'preserve-user-data' \
            "$candidate_home/.open-sleigh/workspaces/sentinel"
          "$candidate_home/.haft/runtimes/haft-embed/current/bin/haft-embed" |
            grep -F 'candidate-haft-embed'

      - name: Exercise latest published network install
        run: |
          published_home="$RUNNER_TEMP/haft-published-home"
          install_bin="$published_home/.local/bin/haft"

          mkdir -p "$published_home/.local/bin"
          HOME="$published_home" bash install.sh

          test -x "$install_bin"
          "$install_bin" version | grep -E '^haft (v)?[0-9]+\.[0-9]+\.[0-9]+'

          response=$(printf '%s\n' \
            '{"jsonrpc":"2.0","method":"initialize","id":1,"params":{}}' |
            HOME="$published_home" "$install_bin" serve 2>/dev/null)
          printf '%s\n' "$response" | grep -F '"protocolVersion"'
          printf '%s\n' "$response" | grep -F '"serverInfo":{"name":"haft"'
          test ! -e "$published_home/.haft/runtimes/open-sleigh/current"
