name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      operation:
        description: Validate current main, or publish artifacts from one successful tag-validation run
        required: true
        default: validate
        type: choice
        options:
          - validate
          - publish
      version:
        description: Semver to embed in dry-run artifacts, without the v prefix
        required: true
        default: '9.0.0'
        type: string
      tag:
        description: Existing annotated v9 tag to publish
        required: false
        type: string
      validation_run_id:
        description: Successful tag-validation workflow run whose artifacts will be published
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  guard:
    name: Validate release candidate
    if: ${{ github.event_name == 'push' || inputs.operation == 'validate' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      sha: ${{ steps.candidate.outputs.sha }}
      short_sha: ${{ steps.candidate.outputs.short_sha }}
      ci_run_id: ${{ steps.ci.outputs.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require exact main SHA and semver
        id: candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          git fetch origin main --no-tags

          candidate_sha=$(git rev-parse HEAD)
          main_sha=$(git rev-parse origin/main)
          short_sha=$(git rev-parse --short HEAD)
          version="${GITHUB_REF_NAME#v}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            test "$(git cat-file -t "$GITHUB_REF")" = "tag"
          fi

          scripts/release/validate-candidate.sh "$version" "$candidate_sha" "$main_sha"

          if [ "$EVENT_NAME" = "push" ]; then
            version_pattern=${version//./\\.}
            test -f ".github/release-notes/${version}.md"
            grep -Eq \
              "^## \\[${version_pattern}\\]([[:space:]]|$)" \
              CHANGELOG.md
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Require successful CI and full-race evidence for exact SHA
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          runs_json="$RUNNER_TEMP/ci-runs.json"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${CANDIDATE_SHA}&event=push&per_page=100" \
            > "$runs_json"

          run_id=$(
            jq -er \
              --arg sha "$CANDIDATE_SHA" \
              '[.workflow_runs[] |
                select(.head_sha == $sha and
                       .event == "push" and
                       .status == "completed" and
                       .conclusion == "success")] |
               sort_by(.run_number) |
               last |
               .id' \
              "$runs_json"
          )

          artifacts_json="$RUNNER_TEMP/ci-artifacts.json"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
            > "$artifacts_json"
          jq -e \
            --arg name "race-aggregate-${CANDIDATE_SHA}" \
            'any(.artifacts[];
                 .name == $name and .expired == false)' \
            "$artifacts_json" >/dev/null

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build CLI ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: [guard]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest,    goos: linux,  goarch: amd64 }
          - { runner: ubuntu-24.04-arm, goos: linux,  goarch: arm64 }
          - { runner: macos-latest,     goos: darwin, goarch: arm64 }
          # darwin-amd64 (Intel Mac) CLI build dropped at v7.0.0:
          # GitHub-hosted macos-13 runners (last Intel Mac image) deprecated
          # by GitHub, scheduling priority lowered, jobs queue 30+ min during
          # peak hours. Apple Silicon now ~95%+ of dev Mac fleet. Intel users
          # can stay on v6.2.1 or request a v7.0.x patch with hand-built
          # darwin-amd64 artifact uploaded via `gh release upload`.
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum
      - name: Install Rust toolchain (embedding sidecar)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (embedding sidecar)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            embed-sidecar/target
          key: ${{ runner.os }}-${{ matrix.goarch }}-embed-cargo-${{ hashFiles('embed-sidecar/Cargo.lock') }}

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/m0n0x41d/haft/internal/cli.Version=${{ needs.guard.outputs.version }} \
              -X github.com/m0n0x41d/haft/internal/cli.Commit=$(git rev-parse --short HEAD) \
              -X github.com/m0n0x41d/haft/internal/cli.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o haft ./cmd/haft/

      # Optional embedding sidecar (haft-embed). ort statically links onnxruntime
      # so the output is a single self-contained binary (no libonnxruntime to
      # ship). continue-on-error: embeddings are OPTIONAL — a sidecar build
      # failure must not block the release; search degrades to FTS5+PPR and
      # install.sh can still source-build it where cargo is present.
      - name: Build embedding sidecar
        id: embed
        continue-on-error: true
        run: |
          cd embed-sidecar
          rm -f target/release/haft-embed
          cargo build --release

      - name: Package
        run: |
          mkdir -p _dist
          mkdir -p runtimes/haft-embed/bin
          sidecar_path=embed-sidecar/target/release/haft-embed
          if [ "${{ steps.embed.outcome }}" = "success" ] && [ -x "$sidecar_path" ]; then
            cp "$sidecar_path" runtimes/haft-embed/bin/haft-embed
            echo "bundled haft-embed sidecar ($(du -h "$sidecar_path" | cut -f1))"
          else
            echo "::warning::haft-embed sidecar not built for ${{ matrix.goos }}-${{ matrix.goarch }} — semantic recall will fall back to FTS5+PPR or install.sh source build"
          fi
          tar czf _dist/haft-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz \
            haft runtimes README.md LICENSE CHANGELOG.md

      - name: Smoke packaged archive
        run: |
          scripts/release/smoke-archive.sh \
            "_dist/haft-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" \
            "${{ needs.guard.outputs.version }}" \
            "${{ needs.guard.outputs.short_sha }}"

      - uses: actions/upload-artifact@v4
        with:
          name: haft-${{ matrix.goos }}-${{ matrix.goarch }}
          path: _dist/*.tar.gz
          if-no-files-found: error
          overwrite: true

  bundle:
    name: Seal validated release artifacts
    if: ${{ github.event_name == 'push' || inputs.operation == 'validate' }}
    needs: [guard, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd _artifacts
          expected_archives=(
            haft-linux-amd64.tar.gz
            haft-linux-arm64.tar.gz
            haft-darwin-arm64.tar.gz
          )

          test "$(find . -maxdepth 1 -name 'haft-*.tar.gz' | wc -l | tr -d ' ')" = "${#expected_archives[@]}"
          for archive in "${expected_archives[@]}"; do
            test -f "$archive"
          done

          sha256sum "${expected_archives[@]}" > checksums.txt
          sha256sum -c checksums.txt

      - name: Upload sealed release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            _artifacts/checksums.txt
            _artifacts/haft-linux-amd64.tar.gz
            _artifacts/haft-linux-arm64.tar.gz
            _artifacts/haft-darwin-arm64.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  publish:
    name: Publish validated GitHub Release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'publish' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Verify tag and validation-run lineage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
        run: |
          test -n "$TAG"
          test -n "$VALIDATION_RUN_ID"
          case "$TAG" in
            v*) ;;
            *)
              echo "tag must be exact semver with a v prefix" >&2
              exit 1
              ;;
          esac
          case "$VALIDATION_RUN_ID" in
            *[!0-9]*)
              echo "validation_run_id must contain only decimal digits" >&2
              exit 1
              ;;
          esac

          git fetch origin main --tags
          tag_ref="refs/tags/$TAG"
          test "$(git cat-file -t "$tag_ref")" = "tag"

          tag_sha=$(git rev-parse "$tag_ref^{commit}")
          main_sha=$(git rev-parse origin/main)
          version="${TAG#v}"
          scripts/release/validate-candidate.sh "$version" "$tag_sha" "$main_sha"

          run_json="$RUNNER_TEMP/validation-run.json"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${VALIDATION_RUN_ID}" \
            > "$run_json"
          jq -e \
            --arg sha "$tag_sha" \
            --arg tag "$TAG" \
            '.event == "push" and
             .conclusion == "success" and
             .head_sha == $sha and
             .head_branch == $tag and
             .path == ".github/workflows/release.yml"' \
            "$run_json" >/dev/null

          notes_file=".github/release-notes/${version}.md"
          test -f "$notes_file"
          version_pattern=${version//./\\.}
          grep -Eq \
            "^## \\[${version_pattern}\\]([[:space:]]|$)" \
            CHANGELOG.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: _artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.validation_run_id }}

      - name: Verify and publish the sealed bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          cd _artifacts
          expected_archives=(
            haft-linux-amd64.tar.gz
            haft-linux-arm64.tar.gz
            haft-darwin-arm64.tar.gz
          )

          sha256sum -c checksums.txt
          test "$(find . -maxdepth 1 -name 'haft-*.tar.gz' | wc -l | tr -d ' ')" = "${#expected_archives[@]}"
          for archive in "${expected_archives[@]}"; do
            test -f "$archive"
          done

          version="${TAG#v}"
          gh release create "$TAG" \
            --verify-tag \
            --title "Haft $TAG" \
            --notes-file "../.github/release-notes/${version}.md" \
            checksums.txt \
            "${expected_archives[@]}"
