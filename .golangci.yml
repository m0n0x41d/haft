version: "2"

run:
  timeout: 5m
  tests: false

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - gosec
    - bodyclose
    - gocritic
    - nolintlint
  settings:
    misspell:
      locale: US
      ignore-rules:
        # "cancelled" is the canonical wire-format spelling for the
        # WorkCommission state and is persisted in artifacts; switching
        # to US "canceled" would be a backwards-incompat data break.
        - cancelled
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
        - elseif
    nolintlint:
      require-explanation: true
      require-specific: true
    gosec:
      excludes:
        - G301 # directory permissions 0755 — fine for user-facing dirs
        - G302 # file permissions 0644 — fine for user-facing files
        - G204 # subprocess with variable — we call quint/git as subprocess intentionally
        - G304 # file inclusion via variable — we read user-specified paths intentionally
        - G306 # WriteFile permissions 0644 — fine for markdown/config files
        - G703 # path traversal — we construct paths from project root intentionally
  exclusions:
    # v2.11.4 already defaults to strict generated-file detection. Keep the
    # frozen production-Go contour explicit instead of depending on that
    # loader default.
    generated: strict
    paths:
      - desktop/
    rules:
      - linters:
          - errcheck
        source: "Send[A-Z][A-Za-z]+\\("
      - linters:
          - errcheck
        source: "os\\.Stderr\\.WriteString\\("
      - linters:
          - errcheck
        source: "syscall\\.Syscall6?\\("
      - linters:
          - staticcheck
        text: "QF1003"
      - linters:
          - staticcheck
        text: "QF1012"
      - linters:
          - errcheck
        source: "defer .*(Close|Rollback)\\(\\)"
      - path: cmd/indexer/main.go
        linters:
          - gosec
        text: "G702:"
      # The preceding carrier-length check proves this uint64 is a valid slice
      # index; keep the generator source bytes stable because they are pinned.
      - path: internal/fpfrefresh/local_practice_rebase.go
        linters:
          - gosec
        text: "G115:"
      # These compatibility adapters are part of the pinned refresh-generator
      # input closure; current production paths use their context-aware forms.
      - path: internal/codebase/symhash.go
        linters:
          - unused
        text: "extractLegacySymbolSnapshots"
      - path: internal/codebase/ts_symbols.go
        linters:
          - unused
        text: "extractTSSymbolSnapshotsFromContent"
      - path: internal/fpf/source_adapter.go
        linters:
          - unused
        text: "removeString"
      - path: internal/artifact/drift_symbol_corpus.go
        linters:
          - unused
        text: "complete"

formatters:
  enable:
    - gofmt
    - goimports
