version: 2

project_name: haft

before:
  hooks: []

builds:
  - id: haft
    dir: .
    main: ./cmd/haft/
    binary: haft
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/m0n0x41d/haft/internal/cli.Version={{ .Version }}
      - -X github.com/m0n0x41d/haft/internal/cli.Commit={{ .ShortCommit }}
      - -X github.com/m0n0x41d/haft/internal/cli.BuildDate={{ .Date }}
    goos:
      - linux
    goarch:
      - amd64

archives:
  - id: haft-cli
    ids:
      - haft
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-cli-{{ .Os }}-{{ .Arch }}"
    files:
      - README*
      - LICENSE*
      - CHANGELOG*

checksum:
  name_template: 'checksums.txt'

changelog:
  use: github-native

release:
  header: |
    ## Haft {{ .Tag }}

    FPF governance substrate. CLI + MCP server + 12 skills for Claude Code / Codex / OpenCode / Cursor.

    ### Install

    ```bash
    curl -fsSL https://quint.codes/install.sh | bash
    ```

    Or build from source (macOS/Linux, requires Go 1.25+):

    ```bash
    go install github.com/m0n0x41d/haft/cmd/haft@latest
    ```

    **Note:** Pre-built binaries are currently Linux amd64 only. macOS users should use `go install` or the install script (which builds from source as fallback).

    See [CHANGELOG](https://github.com/m0n0x41d/haft/blob/main/CHANGELOG.md) for full details.
