version: '3'

vars:
  BIN_NAME: haft
  BIN_DIR: ~/.local/bin
  OPEN_SLEIGH_RELEASE_DIR: open-sleigh/_build/prod/rel/open_sleigh
  OPEN_SLEIGH_INSTALL_DIR: ~/.haft/runtimes/open-sleigh/current

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  test:
    desc: Run all tests
    cmds:
      - go test -count=1 -timeout=90m ./...

  test:race-plan:
    desc: Build and validate the deterministic race qualification plan without running tests
    cmds:
      - |
        go run ./cmd/race-shard \
          --mode plan \
          --shard-count "${RACE_SHARD_COUNT:-12}" \
          --package-timeout "${RACE_PACKAGE_TIMEOUT:-90m}" \
          --output "${RACE_OUTPUT:-/tmp/haft-race-plan.json}"

  test:race-shard:
    desc: Run one validated race qualification shard
    cmds:
      - |
        shard_index="${RACE_SHARD_INDEX:-0}"
        output="${RACE_OUTPUT:-/tmp/haft-race-shard-${shard_index}.json}"
        go run ./cmd/race-shard \
          --mode shard \
          --shard-count "${RACE_SHARD_COUNT:-12}" \
          --shard-index "$shard_index" \
          --package-timeout "${RACE_PACKAGE_TIMEOUT:-90m}" \
          --output "$output"

  test:race:
    desc: Run every validated race qualification shard with bounded local parallelism
    cmds:
      - |
        go run ./cmd/race-shard \
          --mode all \
          --shard-count "${RACE_SHARD_COUNT:-12}" \
          --parallelism "${RACE_PARALLELISM:-0}" \
          --package-timeout "${RACE_PACKAGE_TIMEOUT:-90m}" \
          --output "${RACE_OUTPUT:-/tmp/haft-race-local.json}"

  lint:
    desc: Run linter (go vet)
    cmds:
      - go vet ./...

  fpf-index:
    desc: Low-level deterministic DB build to an explicit FPF_DB from the current FPF checkout; honors FPF_SPEC and does not change source or the integration lock
    cmds:
      - |
        fpf_spec="${FPF_SPEC:-data/FPF/FPF-Spec.md}"
        fpf_db="${FPF_DB:?set FPF_DB to an explicit low-level output path}"
        fpf_revision="$(git -C data/FPF rev-parse HEAD)"
        go run ./cmd/indexer "$fpf_spec" "$fpf_db" "$fpf_revision"
        go run ./cmd/indexer -verify "$fpf_db" "$fpf_spec" "$fpf_revision"

  fpf-verify:
    desc: Read-only verification that checked-out FPF source, DB, integration lock, TypeEnv, and token fixture share one exact basis
    cmds:
      - go run ./cmd/fpf-refresh verify --repo .

  fpf-query-token-gate:
    desc: Verify the pinned embedded 1d5 concern corpus saves at least 30% o200k_base tokens; also run the separate synthetic calculus check
    cmds:
      - bash scripts/fpf_query_token_gate.sh

  fpf-query-token-lock:
    desc: Regenerate the universal binary-only tokenizer dependency lock at the frozen cutoff
    cmds:
      - >-
        uvx --from 'uv==0.11.30'
        uv pip compile
        scripts/fpf_query_token_count.requirements.in
        --universal
        --python-version 3.10
        --only-binary :all:
        --emit-build-options
        --exclude-newer '2026-07-22T00:00:00Z'
        --generate-hashes
        --no-annotate
        --no-sources
        --default-index 'https://pypi.org/simple'
        --custom-compile-command 'task fpf-query-token-lock'
        --output-file scripts/fpf_query_token_count.requirements.txt

  fpf-refresh-check:
    desc: Fetch and evaluate an exact upstream FPF candidate in private temporary artifacts without changing the live publication
    cmds:
      - go run ./cmd/fpf-refresh check --repo .

  fpf-refresh:
    desc: Recoverably apply every structurally supported fresh FPF source/index publication; parser, semantic, query, and token findings print review warnings but do not stop refresh
    cmds:
      - go run ./cmd/fpf-refresh apply --repo .
      - go run ./cmd/fpf-refresh verify --repo .

  fpf-refresh-resume:
    desc: Resume only the exact interrupted FPF apply named by its recovery receipt
    cmds:
      - go run ./cmd/fpf-refresh resume --repo .
      - go run ./cmd/fpf-refresh rebase-local-practice --repo .
      - go run ./cmd/fpf-refresh verify --repo .

  fpf-refresh-restore:
    desc: Restore only the exact predecessor publication named by an interrupted FPF apply receipt
    cmds:
      - go run ./cmd/fpf-refresh restore --repo .

  # build/install/dev use the COMMITTED internal/cli/fpf.db (go:embed'd into the
  # binary), the same source of truth CI verifies but never rebuilds. A
  # maintainer refresh recoverably updates the coherent source + DB + generated
  # integration-lock publication; it does not itself commit or release it.
  build:
    desc: Build Go binary (uses the committed FPF index; run `task fpf-refresh` to refresh the coherent publication)
    cmds:
      - go build -o {{.BIN_NAME}} -trimpath ./cmd/haft/
    generates:
      - '{{.BIN_NAME}}'

  install:
    desc: Build and install haft (CLI + Open-Sleigh runtime) locally
    deps: ['open-sleigh:install-runtime']
    cmds:
      # Remove any stale `haft` in GOBIN so PATH picks up BIN_DIR/haft,
      # not a leftover `go install`'d binary from an older build.
      - |
        gobin="$(go env GOBIN)"
        if [ -z "$gobin" ]; then
          gobin="$(go env GOPATH)/bin"
        fi
        rm -f "$gobin/haft"
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/{{.BIN_NAME}} -trimpath ./cmd/haft/
      # Remove ~/.haft/tui and ~/.haft/tui-v8 leftovers from v7/pre-pivot
      # installs so stale bundles don't sit next to the current governance
      # substrate binary.
      - rm -rf ~/.haft/tui ~/.haft/tui-v8
      - echo "Installed {{.BIN_DIR}}/{{.BIN_NAME}}"
      - echo "Installed {{.OPEN_SLEIGH_INSTALL_DIR}}"

  dev:
    desc: Build Go binary only (no Open-Sleigh runtime release; uses the committed FPF index)
    cmds:
      - go build -o {{.BIN_NAME}} -trimpath ./cmd/haft/

  doctor:
    desc: Run haft doctor health check
    cmds:
      - go run ./cmd/haft doctor

  repomix:
    desc: Pack all code and specs into a timestamped XML review bundle
    vars:
      TIMESTAMP:
        sh: date -u +%Y%m%dT%H%M%SZ
    cmds:
      - mkdir -p .context
      - >-
        repomix
        --include "cmd/**,internal/**,logger/**,open-sleigh/**,spec/**,skills/**,scripts/**,assurance/**,db/**,*.md,*.go,go.mod,go.sum,Taskfile.yaml,*.sql,*.yaml,*.yml,*.json,*.toml"
        --ignore ".git,.context,.haft,.task,.cache,.claude,.codex,.crush,.cursor,.playwright-mcp,.zenflow,.zenflow-attachments,data/FPF,open-sleigh/_build,open-sleigh/deps,node_modules,dist,build,tmp,coverage.out,internal/cli/fpf.db,*.db,*.sqlite,*.log,haft"
        --output ".context/{{.TIMESTAMP}}_repomix.xml"
        --parsable-style
        --include-diffs

  open-sleigh:doctor:
    desc: Check the local Open-Sleigh commission harness prerequisites
    dir: open-sleigh
    cmds:
      - REPO_URL="${REPO_URL:-$(git rev-parse --show-toplevel)}" mix open_sleigh.doctor --path sleigh.commission.md.example --mock-haft

  open-sleigh:doctor-haft:
    desc: Check the Haft commission-source harness prerequisites
    dir: open-sleigh
    cmds:
      - REPO_URL="${REPO_URL:-$(git rev-parse --show-toplevel)}" mix open_sleigh.doctor --path sleigh.haft.md.example --mock-haft

  open-sleigh:smoke:
    desc: Run one deterministic local Open-Sleigh commission smoke
    dir: open-sleigh
    cmds:
      - REPO_URL="${REPO_URL:-$(git rev-parse --show-toplevel)}" mix open_sleigh.start --path sleigh.commission.md.example --mock --once --once-timeout-ms=5000

  open-sleigh:smoke-haft:
    desc: Run one deterministic Haft commission-source smoke
    dir: open-sleigh
    cmds:
      - REPO_URL="${REPO_URL:-$(git rev-parse --show-toplevel)}" mix open_sleigh.start --path sleigh.haft.md.example --mock --once --once-timeout-ms=5000

  open-sleigh:smoke-real-haft:
    desc: Run Open-Sleigh against a real temporary Haft MCP server and WorkCommission
    cmds:
      - bash scripts/open_sleigh_real_haft_smoke.sh

  open-sleigh:smoke-real-haft-dynamic:
    desc: Prove long-running Open-Sleigh picks up new Haft WorkCommissions without restart
    cmds:
      - bash scripts/open_sleigh_real_haft_dynamic_smoke.sh

  open-sleigh:smoke-real-haft-from-decision:
    desc: Prove Haft can create a WorkCommission from a DecisionRecord and Open-Sleigh consumes it
    cmds:
      - bash scripts/open_sleigh_real_haft_from_decision_smoke.sh

  open-sleigh:smoke-real-haft-batch:
    desc: Prove Haft can create a batch of WorkCommissions and Open-Sleigh consumes the queue
    cmds:
      - bash scripts/open_sleigh_real_haft_batch_smoke.sh

  open-sleigh:smoke-real-haft-plan:
    desc: Prove Haft can create WorkCommissions from an ImplementationPlan-lite file
    cmds:
      - bash scripts/open_sleigh_real_haft_plan_smoke.sh

  open-sleigh:smoke-harness-command:
    desc: Prove one haft harness command can create commissions and run Open-Sleigh
    cmds:
      - bash scripts/open_sleigh_harness_command_smoke.sh

  open-sleigh:release:
    desc: Build packaged Open-Sleigh runtime release
    dir: open-sleigh
    cmds:
      - MIX_ENV=prod mix deps.get --only prod
      - MIX_ENV=prod mix release --overwrite

  open-sleigh:install-runtime:
    desc: Install packaged Open-Sleigh runtime under ~/.haft
    deps: ['open-sleigh:release']
    cmds:
      - rm -rf {{.OPEN_SLEIGH_INSTALL_DIR}}
      - mkdir -p "$(dirname {{.OPEN_SLEIGH_INSTALL_DIR}})"
      - cp -R {{.OPEN_SLEIGH_RELEASE_DIR}} {{.OPEN_SLEIGH_INSTALL_DIR}}

  open-sleigh:harness:
    desc: Run local Open-Sleigh commission harness with real agent and mock Haft/Judge
    dir: open-sleigh
    cmds:
      - REPO_URL="${REPO_URL:-$(git rev-parse --show-toplevel)}" mix open_sleigh.start --path sleigh.commission.md.example --mock-haft --mock-judge

  open-sleigh:harness-haft:
    desc: Run Haft commission-source harness with real agent and mock Haft/Judge
    dir: open-sleigh
    cmds:
      - REPO_URL="${REPO_URL:-$(git rev-parse --show-toplevel)}" mix open_sleigh.start --path sleigh.haft.md.example --mock-haft --mock-judge

  open-sleigh:harness-from-decision:
    desc: Create a WorkCommission from DECISION and run the real Haft-backed Open-Sleigh harness
    cmds:
      - bash scripts/open_sleigh_harness_from_decision.sh "{{.DECISION}}"

  open-sleigh:harness-from-decisions:
    desc: Create WorkCommissions from DECISIONS and run the real Haft-backed Open-Sleigh harness
    cmds:
      - DECISIONS="{{.DECISIONS}}" bash scripts/open_sleigh_harness_from_decision.sh

  open-sleigh:harness-plan:
    desc: Create WorkCommissions from PLAN and run the real Haft-backed Open-Sleigh harness
    cmds:
      - PLAN="{{.PLAN}}" bash scripts/open_sleigh_harness_from_decision.sh

  clean:
    desc: Remove local build artifacts
    cmds:
      - rm -f {{.BIN_NAME}}
      - rm -rf open-sleigh/_build

  cleanup:
    desc: Remove all built binaries and installed files
    cmds:
      - rm -f {{.BIN_NAME}}
      - rm -rf open-sleigh/_build
      - rm -f {{.BIN_DIR}}/{{.BIN_NAME}}
      - rm -rf ~/.haft/tui ~/.haft/tui-v8
      - rm -rf {{.OPEN_SLEIGH_INSTALL_DIR}}
      - rm -f {{.BIN_DIR}}/{{.BIN_NAME}}
      - rm -rf {{.TUI_INSTALL_DIR}}
      - rm -rf ~/.haft/runtimes/open-sleigh
      - rm -rf ~/Applications/{{.DESKTOP_APP_NAME}}.app
      - rm -f ~/.haft/bin/haft-desktop
      - rm -f ~/.local/share/applications/haft.desktop
      - echo "Cleaned up"
