version: '3'

vars:
  BIN_NAME: haft
  BIN_DIR: ~/.local/bin

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  test:
    desc: Run all tests
    cmds:
      - go test -count=1 -timeout=90m ./...

  test:race-plan:
    desc: Build and validate the full-repository CI race plan without running tests
    cmds:
      - |
        go run ./cmd/race-shard \
          --mode plan \
          --shard-count "${RACE_SHARD_COUNT:-12}" \
          --package-timeout "${RACE_PACKAGE_TIMEOUT:-90m}" \
          --output "${RACE_OUTPUT:-/tmp/haft-race-plan.json}"

  test:race-shard:
    desc: Run one full-repository CI race shard
    cmds:
      - |
        shard_index="${RACE_SHARD_INDEX:-0}"
        output="${RACE_OUTPUT:-/tmp/haft-race-shard-${shard_index}.json}"
        go run ./cmd/race-shard \
          --mode shard \
          --shard-count "${RACE_SHARD_COUNT:-12}" \
          --shard-index "$shard_index" \
          --package-timeout "${RACE_PACKAGE_TIMEOUT:-90m}" \
          --output "$output"

  test:race:
    desc: Run the bounded critical-race profile from the P13 manifest
    cmds:
      - bash scripts/test-critical-race.sh

  test:race-full:
    desc: Explicitly run the complete CI race qualification locally (very slow)
    cmds:
      - |
        go run ./cmd/race-shard \
          --mode all \
          --shard-count "${RACE_SHARD_COUNT:-12}" \
          --parallelism "${RACE_PARALLELISM:-0}" \
          --package-timeout "${RACE_PACKAGE_TIMEOUT:-90m}" \
          --output "${RACE_OUTPUT:-/tmp/haft-race-local.json}"

  lint:
    desc: Run linter (go vet)
    cmds:
      - go vet ./...

  fpf-index:
    desc: Low-level deterministic DB build to an explicit FPF_DB from the current FPF checkout; honors FPF_SPEC and does not change source or the integration lock
    cmds:
      - |
        fpf_spec="${FPF_SPEC:-data/FPF/FPF-Spec.md}"
        fpf_db="${FPF_DB:?set FPF_DB to an explicit low-level output path}"
        fpf_revision="$(git -C data/FPF rev-parse HEAD)"
        go run ./cmd/indexer "$fpf_spec" "$fpf_db" "$fpf_revision"
        go run ./cmd/indexer -verify "$fpf_db" "$fpf_spec" "$fpf_revision"

  fpf-verify:
    desc: Read-only verification that checked-out FPF source, DB, integration lock, TypeEnv, and token fixture share one exact basis
    cmds:
      - go run ./cmd/fpf-refresh verify --repo .

  fpf-query-token-gate:
    desc: Verify the pinned embedded 1d5 concern corpus saves at least 30% o200k_base tokens; also run the separate synthetic calculus check
    cmds:
      - bash scripts/fpf_query_token_gate.sh

  fpf-query-token-lock:
    desc: Regenerate the universal binary-only tokenizer dependency lock at the frozen cutoff
    cmds:
      - >-
        uvx --from 'uv==0.11.30'
        uv pip compile
        scripts/fpf_query_token_count.requirements.in
        --universal
        --python-version 3.10
        --only-binary :all:
        --emit-build-options
        --exclude-newer '2026-07-22T00:00:00Z'
        --generate-hashes
        --no-annotate
        --no-sources
        --default-index 'https://pypi.org/simple'
        --custom-compile-command 'task fpf-query-token-lock'
        --output-file scripts/fpf_query_token_count.requirements.txt

  fpf-refresh-check:
    desc: Fetch and evaluate an exact upstream FPF candidate in private temporary artifacts without changing the live publication
    cmds:
      - go run ./cmd/fpf-refresh check --repo .

  fpf-refresh:
    desc: Recoverably apply every structurally supported fresh FPF source/index publication; parser, semantic, query, and token findings print review warnings but do not stop refresh
    cmds:
      - go run ./cmd/fpf-refresh apply --repo .
      - go run ./cmd/fpf-refresh verify --repo .

  fpf-refresh-resume:
    desc: Resume only the exact interrupted FPF apply named by its recovery receipt
    cmds:
      - go run ./cmd/fpf-refresh resume --repo .
      - go run ./cmd/fpf-refresh rebase-local-practice --repo .
      - go run ./cmd/fpf-refresh verify --repo .

  fpf-refresh-restore:
    desc: Restore only the exact predecessor publication named by an interrupted FPF apply receipt
    cmds:
      - go run ./cmd/fpf-refresh restore --repo .

  # build/install/dev use the COMMITTED internal/cli/fpf.db (go:embed'd into the
  # binary), the same source of truth CI verifies but never rebuilds. A
  # maintainer refresh recoverably updates the coherent source + DB + generated
  # integration-lock publication; it does not itself commit or release it.
  build:
    desc: Build Go binary (uses the committed FPF index; run `task fpf-refresh` to refresh the coherent publication)
    cmds:
      - go build -o {{.BIN_NAME}} -trimpath ./cmd/haft/
    generates:
      - '{{.BIN_NAME}}'

  install:
    desc: Build and install the Haft CLI locally
    cmds:
      # Remove any stale `haft` in GOBIN so PATH picks up BIN_DIR/haft,
      # not a leftover `go install`'d binary from an older build.
      - |
        gobin="$(go env GOBIN)"
        if [ -z "$gobin" ]; then
          gobin="$(go env GOPATH)/bin"
        fi
        rm -f "$gobin/haft"
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/{{.BIN_NAME}} -trimpath ./cmd/haft/
      # Remove ~/.haft/tui and ~/.haft/tui-v8 leftovers from v7/pre-pivot
      # installs so stale bundles don't sit next to the current governance
      # substrate binary.
      - rm -rf ~/.haft/tui ~/.haft/tui-v8
      # v9 removes only the exact Haft-managed v8 executor runtime. User data
      # under ~/.open-sleigh and the independent haft-embed runtime survive.
      - |
        if [ -z "${HOME:-}" ]; then
          echo "Preserved legacy runtime because HOME is unset"
        else
          legacy_runtime="$HOME/.haft/runtimes/open-sleigh/current"
          legacy_parent_safe=true
          for parent in "$HOME/.haft" "$HOME/.haft/runtimes" "$HOME/.haft/runtimes/open-sleigh"; do
            if [ -L "$parent" ]; then
              legacy_parent_safe=false
            fi
          done
          if [ "$legacy_parent_safe" = true ]; then
            rm -rf -- "$legacy_runtime"
            rmdir -- "$HOME/.haft/runtimes/open-sleigh" 2>/dev/null || true
          else
            echo "Preserved legacy runtime because a managed parent is a symlink"
          fi
        fi
      - echo "Installed {{.BIN_DIR}}/{{.BIN_NAME}}"

  dev:
    desc: Build the Go binary using the committed FPF index
    cmds:
      - go build -o {{.BIN_NAME}} -trimpath ./cmd/haft/

  doctor:
    desc: Run haft doctor health check
    cmds:
      - go run ./cmd/haft doctor

  repomix:
    desc: Pack all code and specs into a timestamped XML review bundle
    vars:
      TIMESTAMP:
        sh: date -u +%Y%m%dT%H%M%SZ
    cmds:
      - mkdir -p .context
      - >-
        repomix
        --include "cmd/**,internal/**,logger/**,spec/**,skills/**,scripts/**,assurance/**,db/**,*.md,*.go,go.mod,go.sum,Taskfile.yaml,*.sql,*.yaml,*.yml,*.json,*.toml"
        --ignore ".git,.context,.haft,.task,.cache,.claude,.codex,.crush,.cursor,.playwright-mcp,.zenflow,.zenflow-attachments,data/FPF,node_modules,dist,build,tmp,coverage.out,internal/cli/fpf.db,*.db,*.sqlite,*.log,haft"
        --output ".context/{{.TIMESTAMP}}_repomix.xml"
        --parsable-style
        --include-diffs

  clean:
    desc: Remove local build artifacts
    cmds:
      - rm -f {{.BIN_NAME}}

  cleanup:
    desc: Remove all built binaries and installed files
    cmds:
      - rm -f {{.BIN_NAME}}
      - rm -f {{.BIN_DIR}}/{{.BIN_NAME}}
      - rm -rf ~/.haft/tui ~/.haft/tui-v8
      - |
        if [ -n "${HOME:-}" ]; then
          legacy_runtime="$HOME/.haft/runtimes/open-sleigh/current"
          legacy_parent_safe=true
          for parent in "$HOME/.haft" "$HOME/.haft/runtimes" "$HOME/.haft/runtimes/open-sleigh"; do
            if [ -L "$parent" ]; then
              legacy_parent_safe=false
            fi
          done
          if [ "$legacy_parent_safe" = true ]; then
            rm -rf -- "$legacy_runtime"
            rmdir -- "$HOME/.haft/runtimes/open-sleigh" 2>/dev/null || true
          else
            echo "Preserved legacy runtime because a managed parent is a symlink"
          fi
        fi
      - rm -f {{.BIN_DIR}}/{{.BIN_NAME}}
      - rm -rf {{.TUI_INSTALL_DIR}}
      - rm -rf ~/Applications/{{.DESKTOP_APP_NAME}}.app
      - rm -f ~/.haft/bin/haft-desktop
      - rm -f ~/.local/share/applications/haft.desktop
      - echo "Cleaned up"
