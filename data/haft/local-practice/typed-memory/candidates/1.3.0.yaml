    invariants:
      - "EntityOfConcern is a scoped U.Entity slot filler, not a stored Haft kind."
      - "ProblemCard and SolutionPortfolio are relation roles over ProjectRecord, not invented FPF Core kinds."
      - "A WorkPlanRecord is not performed Work and a local occurrence record does not claim exact U.Work semantics."
      - "EvidenceUse is a Haft-local record/use contract; exact FPF Evidence semantics remain underdetermined."
      - "Graph direction carries only the declared relation and does not imply causal, temporal, or work order."
      - "ProjectEpistemeConstitutionBasis is a local three-input carrier, not the source C.2.1 EpistemeConstitutionRelationSignature, an obtaining relation occurrence, or proof that the constitution predicate obtains."
      - "The project-memory ReferenceScheme codec binds inherited U.ReferenceScheme by value and neither admits a new U-kind nor substitutes a TypeEnv or legacy Primary/Anchors carrier identifier for the scheme."
