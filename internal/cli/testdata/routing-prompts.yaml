# Golden routing-test prompts for v8 governance substrate skill catalog.
#
# Each entry pairs an operator-style prompt with the skill that SHOULD
# route per the skill descriptions in internal/cli/skill/h-*/SKILL.md.
# The `haft check routing` runner uses a heuristic keyword-overlap
# matcher (best-effort approximation of how Claude Code / Codex match
# skill descriptions to operator intent) and reports the cases where
# the heuristic does NOT pick the expected skill.
#
# This is a sanity check, not the real Claude Code matcher. False
# positives possible. Treat failures as "the description may need
# sharper trigger keywords" rather than "broken installation".
#
# Skill set per v8 governance substrate pivot
# (dec-20260525-v8-architecture-pivot):
#   h-fpf, h-frame, h-diagnose, h-explore, h-compare, h-decide,
#   h-verify, h-status, h-spec, h-onboard, h-spec-cover, h-note,
#   h-commission, h-abduct, h-boundary-unpack, h-semio-review
#
# Manual-only (must NOT auto-fire even on matching prompts):
#   h-decide, h-commission, h-abduct, h-boundary-unpack, h-semio-review

cases:
  # ===== h-frame =====
  - prompt: "let me think about this auth performance issue before solving it"
    expected: h-frame
    rationale: explicit framing intent + "before" trigger
  - prompt: "what's actually going on with the cache invalidation problem"
    expected: h-frame
  - prompt: "I want to understand X first before we propose fixes"
    expected: h-frame
  - prompt: "frame the problem of memory growth on the OAuth provider"
    expected: h-frame

  # ===== h-diagnose =====
  - prompt: "tests are failing on schema migrations"
    expected: h-diagnose
  - prompt: "the auth endpoint doesn't work after the deploy, investigate"
    expected: h-diagnose
  - prompt: "why is the cache invalidation broken on M1 builds"
    expected: h-diagnose
  - prompt: "what's causing the intermittent 502 on the API gateway"
    expected: h-diagnose

  # ===== h-explore =====
  - prompt: "what are our options for handling rate limits"
    expected: h-explore
  - prompt: "brainstorm approaches to the slow database query"
    expected: h-explore
  - prompt: "different ways to do session storage"
    expected: h-explore
  - prompt: "how could we solve the connection pool exhaustion"
    expected: h-explore

  # ===== h-compare =====
  - prompt: "compare redis and in-memory for the cache"
    expected: h-compare
  - prompt: "trade-off between batching and streaming for events"
    expected: h-compare
  - prompt: "which is better for our use case, NATS or RabbitMQ"
    expected: h-compare
  - prompt: "compare A and B for the rate limiter implementation"
    expected: h-compare

  # ===== h-verify =====
  - prompt: "did the dec-20260525-x decision actually work"
    expected: h-verify
  - prompt: "is the auth refactor still valid given the latency we're seeing"
    expected: h-verify
  - prompt: "verify the cache decision predictions held"
    expected: h-verify
  - prompt: "measure the impact of the rate limit change"
    expected: h-verify

  # ===== h-status =====
  - prompt: "where are we on the project"
    expected: h-status
  - prompt: "what's stale right now"
    expected: h-status
  - prompt: "show me the project FPF state"
    expected: h-status
  - prompt: "what needs attention in haft"
    expected: h-status

  # ===== h-spec =====
  - prompt: "show me the spec lifecycle status"
    expected: h-spec
  - prompt: "update the target system spec from this clarification"
    expected: h-spec
  - prompt: "запиши это уточнение в спеки"
    expected: h-spec
  - prompt: "the spec section is stale, should we rebaseline or reopen it"
    expected: h-spec

  # ===== h-onboard =====
  - prompt: "set up haft for this new project"
    expected: h-onboard
  - prompt: "first time using haft in this repo, walk me through it"
    expected: h-onboard
  - prompt: "onboard this project to FPF"
    expected: h-onboard

  # ===== h-spec-cover =====
  - prompt: "is the auth module covered by decisions"
    expected: h-spec-cover
  - prompt: "what's spec coverage on internal/billing"
    expected: h-spec-cover
  - prompt: "show me the documentation coverage gaps"
    expected: h-spec-cover

  # ===== h-note =====
  - prompt: "remember that we ruled out PostgreSQL because of cost"
    expected: h-note
  - prompt: "FYI for later, the staging cluster uses 4 nodes not 3"
    expected: h-note
  - prompt: "side note: prefer kebab-case for new endpoint paths"
    expected: h-note

  # ===== h-fpf (FALLBACK — should only match generic FPF queries) =====
  - prompt: "what does FPF say about parity"
    expected: h-fpf
  - prompt: "which haft skill should I use for managing decisions"
    expected: h-fpf
  - prompt: "tell me about FPF generally"
    expected: h-fpf

  # ===== NEGATIVE cases — manual-only skills must NOT auto-fire =====
  # Per Transformer Mandate, h-decide and h-commission have
  # disable-model-invocation: true. The heuristic SHOULD still treat
  # them as plausible matches by description, but the actual host
  # respects the frontmatter flag. We mark them as expected=NONE so
  # the runner reports a CLEAN match against any non-disabled skill.

  # ===== Subroutine skills — typically not surfaced for auto-trigger =====
  # (Operator calls them explicitly via /h-abduct, /h-boundary-unpack,
  # /h-semio-review. The runner allows partial match here.)
  - prompt: "rename Service to EnablingSystem across the codebase"
    expected: h-semio-review
  - prompt: "audit our spec for consistency after the rename"
    expected: h-semio-review
  - prompt: "decompose this API contract into L/A/D/E quadrants"
    expected: h-boundary-unpack
  - prompt: "generate at least 3 rival hypotheses for the auth issue"
    expected: h-abduct
